server:
  port: 8080

spring:
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/fishmart?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${MYSQL_USER:fishmart_user}"
    password: "${MYSQL_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: "${JWT_ISSUER:aquatic-platform}"
    secret: "${JWT_SECRET:}"
    accessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:10080}"
  upload:
    dir: uploads
  private-upload:
    dir: "${PRIVATE_UPLOAD_DIR:private-uploads}"
  print:
    dir: print-files
  diagnose-image:
    dir: diagnose-images
  retention:
    visits-days: "${VISIT_RETENTION_DAYS:90}"
    diagnoses-days: "${DIAGNOSIS_RETENTION_DAYS:90}"
    print-files-days: "${PRINT_FILE_RETENTION_DAYS:7}"
  cors:
    allowedOrigins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:5174"
      - "http://localhost:5175"
      - "http://localhost:5176"
  admin:
    username: "${ADMIN_USERNAME:admin}"
    password: "${ADMIN_PASSWORD:}"
  ai:
    glm4BaseUrl: "${AI_BASE_URL:}"
    apiKey: "${AI_API_KEY:}"
    model: "${AI_MODEL:}"
