server:
  port: 8080

spring:
  datasource:
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/fishmart?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${MYSQL_USER:fishmart_user}"
    password: "${MYSQL_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

logging:
  level:
    org.hibernate.SQL: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: "${JWT_ISSUER:bluemap}"
    secret: "${JWT_SECRET:}"
    accessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES:240}"
  upload:
    dir: uploads
  print:
    dir: print-files
  diagnose-image:
    dir: diagnose-images
  cors:
    allowedOrigins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:5174"
      - "http://localhost:5175"
      - "http://localhost:5176"
  admin:
    username: "${ADMIN_USERNAME:admin}"
    password: "${ADMIN_PASSWORD:}"
  ai:
    glm4BaseUrl: "${AI_BASE_URL:}"
    apiKey: "${AI_API_KEY:}"
    model: "${AI_MODEL:}"
